[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "article" }]

[project]
name = "article-python-template"
version = "2026.07.1"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.3.4",
    "matplotlib==3.10.9",
    "plotly==6.7.0",
    "kaleido==1.3.0",
    "python-dotenv==1.2.2",
    "flake8==7.3.0",
]

requires-python = ">=3.12"

authors = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]
maintainers = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]

description = "Template for a paper's data-analysis / artifact-generation pipeline (figures, LaTeX tables, BibTeX)"
readme = "README.md"
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/augustocristian/article-python-template"
Repository = "https://github.com/augustocristian/article-python-template"
"Bug Tracker" = "https://github.com/augustocristian/article-python-template/issues"
Changelog = "https://github.com/augustocristian/article-python-template/blob/main/CHANGELOG.md"
