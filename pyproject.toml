[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "article-python-template"
version = "2026.07.1"
description = "Template for an article's data-analysis / artifact-generation pipeline (figures, LaTeX tables, BibTeX)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]
maintainers = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/augustocristian/article-python-template"
Repository = "https://github.com/augustocristian/article-python-template"
"Bug Tracker" = "https://github.com/augustocristian/article-python-template/issues"
Changelog = "https://github.com/augustocristian/article-python-template/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "article" }]

[tool.poetry.dependencies]
python = ">=3.12"
pandas = "==3.0.3"
numpy = "==2.3.4"
matplotlib = "==3.10.9"
plotly = "==6.9.0"
kaleido = "==1.3.0"
python-dotenv = "==1.2.2"
flake8 = "==7.3.0"
