sonar.projectKey=augustocristian_article-python-template
sonar.organization=augustocristian
sonar.sources=.
sonar.exclusions=.git/**,**/outputs/**
sonar.python.version=3.12
# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=article-python-template
#sonar.projectVersion=1.0
# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# No automated tests ship with this template (it's data-pipeline scripts, not
# a library), so there's no coverage report to point at. Excluding every file
# from the coverage metric means there's nothing for the default Quality
# Gate's "Coverage on New Code" condition to measure against, so it passes
# instead of failing on an inherent 0%. If you add tests to a project
# generated from this template: remove this line, add back a line like
# sonar.python.coverage.reportPaths=coverage-unit/coverage.xml, and reinstate
# a pytest step in ci.yml that produces that report.
sonar.coverage.exclusions=**/*
